<title id="t">HYDRA-UMC-ANOMALY-DETECTOR architecture</title>
<desc id="d">HYDRA-UMC-ANOMALY-DETECTOR reads the telemetry of a series from HYDRA-UMC-DATALAKE, turns each window into a frequency spectrum with an FFT, compares every bin with the baseline of that series and raises an alarm when the z-score passes the threshold. It watches the drift of the baseline, writes its verdicts back to the data lake and publishes alarms over MQTT. It is a statistical detector, not a trained model.</desc>
